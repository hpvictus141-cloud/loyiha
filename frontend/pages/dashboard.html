<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - OmborXona</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* Additional modern animations and styles */
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }
    
    .loading-shimmer {
      animation: shimmer 2s infinite linear;
      background: linear-gradient(to right, rgba(59, 130, 246, 0.05) 0%, rgba(59, 130, 246, 0.15) 50%, rgba(59, 130, 246, 0.05) 100%);
      background-size: 1000px 100%;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      animation: fadeInUp 0.6s ease-out both;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.1);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      border-bottom: 1px solid rgba(59, 130, 246, 0.15);
    }

    .table td {
      padding: 14px 16px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(59, 130, 246, 0.08);
    }

    .table tbody tr {
      transition: all 0.3s ease;
    }

    .table tbody tr:hover {
      background: rgba(59, 130, 246, 0.05);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-state-description {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 20px;
    }

    .grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    }

    .table-container {
      overflow-x: auto;
      max-height: 400px;
    }

    .table-container::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .table-container::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    .table-container::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="navbar" id="navbar"></header>
    <main class="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle" id="greeting-text"></p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="loadDashboard()">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Yangilash
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-cards" id="stats-cards">
        <div class="stat-card">
          <div class="stat-card-icon blue"><div class="skeleton" style="width:32px;height:32px;border-radius:8px"></div></div>
          <div class="stat-card-body"><div class="skeleton" style="height:14px;width:80%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon green"><div class="skeleton" style="width:32px;height:32px;border-radius:8px"></div></div>
          <div class="stat-card-body"><div class="skeleton" style="height:14px;width:80%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon orange"><div class="skeleton" style="width:32px;height:32px;border-radius:8px"></div></div>
          <div class="stat-card-body"><div class="skeleton" style="height:14px;width:80%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon red"><div class="skeleton" style="width:32px;height:32px;border-radius:8px"></div></div>
          <div class="stat-card-body"><div class="skeleton" style="height:14px;width:80%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
        </div>
      </div>

      <!-- Charts + Recent -->
      <div class="grid" style="grid-template-columns:1fr 360px;gap:20px;margin-bottom:24px">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Kirim/Chiqim dinamikasi (so'nggi 30 kun)</span>
          </div>
          <div class="card-body">
            <div class="chart-wrapper">
              <canvas id="movements-chart"></canvas>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Bugungi ko'rsatkichlar</span></div>
          <div class="card-body">
            <div class="chart-wrapper">
              <canvas id="today-chart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Low stock + Recent activity -->
      <div class="grid grid-2" style="gap:20px">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Kam qolgan mahsulotlar</span>
            <a href="inventory.html" class="btn btn-secondary btn-sm">Barchasi</a>
          </div>
          <div class="table-container">
            <table class="table">
              <thead><tr><th>Mahsulot</th><th>Qoldiq</th><th>Min</th><th>Holat</th></tr></thead>
              <tbody id="low-stock-table"><tr><td colspan="4"><div class="skeleton" style="height:40px;margin:8px"></div></td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">So'nggi kirimlar</span>
            <a href="stock-in.html" class="btn btn-secondary btn-sm">Barchasi</a>
          </div>
          <div class="table-container">
            <table class="table">
              <thead><tr><th>Mahsulot</th><th>Miqdor</th><th>Sana</th></tr></thead>
              <tbody id="recent-stock-in-table"><tr><td colspan="3"><div class="skeleton" style="height:40px;margin:8px"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/realtime.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  if (!Layout.init()) throw new Error('Auth failed');
  Layout.setBreadcrumb([{label: 'Dashboard'}]);

  const now = new Date();
  const hours = now.getHours();
  let greet = hours < 12 ? 'Xayrli tong' : hours < 17 ? 'Xayrli kun' : 'Xayrli kech';
  const user = Auth.getUser();
  document.getElementById('greeting-text').textContent = `${greet}, ${user?.fullName || 'Foydalanuvchi'}`;

  // Initialize real-time updates
  const realtimeManager = new RealtimeManager();
  realtimeManager.init();
  realtimeManager.subscribe('dashboard', loadDashboard);

  let movementsChart, todayChart;

  async function loadDashboard() {
    const user = Auth.getUser();
    const isAdmin = user?.role?.name === 'Admin';
    
    try {
      const data = await api.get('/dashboard/stats');
      const { stats, lowStockProducts, recentStockIns } = data.data;
      renderStats(stats, isAdmin);
      renderLowStock(lowStockProducts);
      if (isAdmin) {
        renderRecentStockIn(recentStockIns);
        renderCharts(stats);
      } else {
        // Operator uchun grafiklar va kirim jadvalini yashirish
        document.querySelector('.grid').style.display = 'none';
        const tables = document.querySelectorAll('.card');
        if (tables.length > 1) {
          tables[1].style.display = 'none'; // Kirim jadvalini yashirish
        }
      }
    } catch (e) {
      Toast.error(e.message);
    }
  }

  function renderStats(stats, isAdmin) {
    if (isAdmin) {
      // Admin uchun to'liq statistika
      document.getElementById('stats-cards').innerHTML = `
        <div class="stat-card">
          <div class="stat-card-icon blue">
            <svg width="28" height="28" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          </div>
          <div class="stat-card-body">
            <div class="stat-card-label">Jami mahsulotlar</div>
            <div class="stat-card-value" data-value="${stats.products}">${Utils.formatNumber(stats.products)}</div>
            <div class="stat-card-meta">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
              ${stats.categories} ta kategoriya
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon green">
            <svg width="28" height="28" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
          </div>
          <div class="stat-card-body">
            <div class="stat-card-label">Bugungi kirim</div>
            <div class="stat-card-value" data-value="${stats.todayStockIns}">${Utils.formatNumber(stats.todayStockIns)}</div>
            <div class="stat-card-meta">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              ${Utils.formatCurrency(stats.todayStockInValue)}
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon orange">
            <svg width="28" height="28" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/></svg>
          </div>
          <div class="stat-card-body">
            <div class="stat-card-label">Bugungi chiqim</div>
            <div class="stat-card-value" data-value="${stats.todayStockOuts}">${Utils.formatNumber(stats.todayStockOuts)}</div>
            <div class="stat-card-meta">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              Operatsiyalar soni
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon red">
            <svg width="28" height="28" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <div class="stat-card-body">
            <div class="stat-card-label">Kam qolgan</div>
            <div class="stat-card-value" data-value="${stats.lowStock}">${Utils.formatNumber(stats.lowStock)}</div>
            <div class="stat-card-meta">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
              Minimal darajadan past
            </div>
          </div>
        </div>
      `;
    } else {
      // Operator uchun oddiy statistika
      document.getElementById('stats-cards').innerHTML = `
        <div class="stat-card">
          <div class="stat-card-icon blue">
            <svg width="28" height="28" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          </div>
          <div class="stat-card-body">
            <div class="stat-card-label">Jami mahsulotlar</div>
            <div class="stat-card-value" data-value="${stats.products}">${Utils.formatNumber(stats.products)}</div>
            <div class="stat-card-meta">${stats.categories} ta kategoriya</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon orange">
            <svg width="28" height="28" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
          </div>
          <div class="stat-card-body">
            <div class="stat-card-label">Kategoriyalar</div>
            <div class="stat-card-value" data-value="${stats.categories}">${Utils.formatNumber(stats.categories)}</div>
            <div class="stat-card-meta">Faol kategoriyalar</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon red">
            <svg width="28" height="28" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <div class="stat-card-body">
            <div class="stat-card-label">Kam qolgan</div>
            <div class="stat-card-value" data-value="${stats.lowStock}">${Utils.formatNumber(stats.lowStock)}</div>
            <div class="stat-card-meta">Minimal darajadan past</div>
          </div>
        </div>
      `;
    }
    
    // Animate counter values
    setTimeout(() => {
      AnimatedCounter.animateAll();
    }, 100);
  }

  function renderLowStock(products) {
    const tbody = document.getElementById('low-stock-table');
    if (!products?.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state" style="padding:30px"><p class="empty-state-description">Kam qolgan mahsulot yo'q</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = products.map(p => `
      <tr>
        <td><span style="font-weight:500">${Utils.escapeHtml(p.name)}</span></td>
        <td>${Utils.formatNumber(p.currentStock)} ${Utils.escapeHtml(p.unit?.symbol || '')}</td>
        <td>${Utils.formatNumber(p.minStock)} ${Utils.escapeHtml(p.unit?.symbol || '')}</td>
        <td><span class="badge badge-danger">Kam</span></td>
      </tr>
    `).join('');
  }

  function renderRecentStockIn(items) {
    const tbody = document.getElementById('recent-stock-in-table');
    if (!items?.length) {
      tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state" style="padding:30px"><p class="empty-state-description">Kirim yo'q</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(s => `
      <tr>
        <td><span style="font-weight:500">${Utils.escapeHtml(s.product?.name || '-')}</span></td>
        <td>${Utils.formatNumber(s.quantity)} ${Utils.escapeHtml(s.product?.unit?.symbol || '')}</td>
        <td>${Utils.formatDate(s.date)}</td>
      </tr>
    `).join('');
  }

  function renderCharts(stats) {
    const isDark = ThemeManager.getCurrent() === 'dark';
    const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
    const textColor = isDark ? '#9ca3af' : '#6b7280';

    if (movementsChart) movementsChart.destroy();
    const ctx = document.getElementById('movements-chart').getContext('2d');
    movementsChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['1-hafta', '2-hafta', '3-hafta', '4-hafta'],
        datasets: [
          { label: 'Kirim', data: [0, 0, 0, stats.todayStockIns], borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)', borderWidth: 2, fill: true, tension: 0.4 },
          { label: 'Chiqim', data: [0, 0, 0, stats.todayStockOuts], borderColor: '#d97706', backgroundColor: 'rgba(217,119,6,0.1)', borderWidth: 2, fill: true, tension: 0.4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: textColor, font: { size: 12 } } } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: textColor } },
          y: { grid: { color: gridColor }, ticks: { color: textColor } }
        }
      }
    });

    if (todayChart) todayChart.destroy();
    const ctx2 = document.getElementById('today-chart').getContext('2d');
    todayChart = new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: ['Kirim', 'Chiqim', 'Yetkazib beruvchilar'],
        datasets: [{
          data: [stats.todayStockIns || 1, stats.todayStockOuts || 1, stats.suppliers || 1],
          backgroundColor: ['#2563eb', '#d97706', '#059669'],
          borderWidth: 0, hoverOffset: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: textColor, padding: 16, font: { size: 12 } } } }
      }
    });
  }

  loadDashboard();
</script>
</body>
</html>
