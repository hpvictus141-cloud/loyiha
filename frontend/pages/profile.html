<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - OmborXona</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="navbar" id="navbar"></header>
    <main class="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Profil</h1>
          <p class="page-subtitle">Shaxsiy ma'lumotlar va sozlamalar</p>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:320px 1fr;gap:24px">
        <!-- Profile Card -->
        <div class="card">
          <div class="card-body" style="text-align:center;padding:32px 24px">
            <div id="profile-avatar" style="width:100px;height:100px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:700;margin:0 auto 16px"></div>
            <h3 id="profile-name" style="font-size:18px;font-weight:600;margin-bottom:4px"></h3>
            <p id="profile-username" style="font-size:14px;color:var(--text-secondary);margin-bottom:8px"></p>
            <span id="profile-role" class="badge badge-info"></span>
            <div class="divider" style="margin:24px 0"></div>
            <div style="display:flex;flex-direction:column;gap:10px;text-align:left">
              <div style="display:flex;align-items:center;gap:10px">
                <svg width="16" height="16" fill="none" stroke="var(--text-muted)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span id="profile-username" style="font-size:13px;color:var(--text-secondary)"></span>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <svg width="16" height="16" fill="none" stroke="var(--text-muted)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <span id="profile-phone" style="font-size:13px;color:var(--text-secondary)"></span>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <svg width="16" height="16" fill="none" stroke="var(--text-muted)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span id="profile-created" style="font-size:13px;color:var(--text-secondary)"></span>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <svg width="16" height="16" fill="none" stroke="var(--text-muted)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="profile-lastlogin" style="font-size:13px;color:var(--text-secondary)"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Edit Forms -->
        <div style="display:flex;flex-direction:column;gap:20px">
          <!-- Personal Info -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">Shaxsiy ma'lumotlar</span>
            </div>
            <div class="card-body">
              <form style="display:flex;flex-direction:column;gap:16px">
                <div class="grid grid-2" style="gap:16px">
                  <div class="form-group">
                    <label class="form-label">To'liq ism</label>
                    <input type="text" id="edit-fullName" class="form-control" onkeypress="return Utils.allowOnlyLetters(event)">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Telefon</label>
                    <input type="text" id="edit-phone" class="form-control" placeholder="+998 XX XXX XX XX">
                  </div>
                </div>
                <button type="button" class="btn btn-primary" onclick="updateProfile()" style="width:fit-content">
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  Yangilash
                </button>
              </form>
            </div>
          </div>

          <!-- Change Password -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">Parolni o'zgartirish</span>
            </div>
            <div class="card-body">
              <form style="display:flex;flex-direction:column;gap:16px">
                <div class="form-group">
                  <label class="form-label">Joriy parol</label>
                  <input type="password" id="pwd-current" class="form-control" placeholder="Joriy parol">
                  <span id="pwd-current-error" class="form-error"></span>
                </div>
                <div class="form-group">
                  <label class="form-label">Yangi parol</label>
                  <input type="password" id="pwd-new" class="form-control" placeholder="Kamida 6 ta belgi">
                  <span id="pwd-new-error" class="form-error"></span>
                </div>
                <div class="form-group">
                  <label class="form-label">Yangi parolni tasdiqlash</label>
                  <input type="password" id="pwd-confirm" class="form-control" placeholder="Yangi parolni qayta kiriting">
                  <span id="pwd-confirm-error" class="form-error"></span>
                </div>
                <button type="button" class="btn btn-primary" onclick="changePassword()" style="width:fit-content">
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                  Parolni o'zgartirish
                </button>
              </form>
            </div>
          </div>

          <!-- Sessions -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">Aktiv sessiyalar</span>
              <button class="btn btn-danger btn-sm" onclick="logoutAllSessions()">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Barcha sessiyalardan chiqish
              </button>
            </div>
            <div class="card-body">
              <p style="font-size:14px;color:var(--text-secondary)">Joriy sessiya: Brauzer orqali faol</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  if (!Layout.init()) throw new Error('Auth failed');
  Layout.setBreadcrumb([{label: 'Boshqaruv'}, {label: 'Profil'}]);

  // Telefon inputni sozlash
  Utils.setupPhoneInput('edit-phone');

  async function loadProfile() {
    try {
      const data = await api.get('/auth/profile');
      const user = data.data;

      const initials = user.fullName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('profile-avatar').textContent = initials;
      document.getElementById('profile-name').textContent = user.fullName;
      document.getElementById('profile-username').textContent = '@' + user.username;
      document.getElementById('profile-role').textContent = user.role?.name || '';
      document.getElementById('profile-phone').textContent = user.phone || 'Kiritilmagan';
      document.getElementById('profile-created').textContent = 'Ro\'yxatdan o\'tgan: ' + Utils.formatDate(user.createdAt);
      document.getElementById('profile-lastlogin').textContent = user.lastLogin ? 'Oxirgi kirish: ' + Utils.formatDate(user.lastLogin, 'DD.MM.YYYY HH:mm') : 'Hali kirmagan';

      document.getElementById('edit-fullName').value = user.fullName;
      document.getElementById('edit-phone').value = user.phone || '';
    } catch(e) { Toast.error(e.message); }
  }

  async function updateProfile() {
    const fullName = document.getElementById('edit-fullName').value.trim();
    const phone = document.getElementById('edit-phone').value.trim();

    if (!fullName) {
      Toast.error('To\'liq ism talab qilinadi');
      return;
    }

    try {
      await api.put('/auth/profile', { fullName, phone });
      Toast.success('Profil yangilandi');
      const user = Auth.getUser();
      user.fullName = fullName;
      user.phone = phone;
      api.setUser(user);
      loadProfile();
      Layout.renderSidebar();
    } catch(e) { Toast.error(e.message); }
  }

  async function changePassword() {
    ['pwd-current-error','pwd-new-error','pwd-confirm-error'].forEach(id => {
      document.getElementById(id).textContent = '';
    });

    const current = document.getElementById('pwd-current').value;
    const newPwd = document.getElementById('pwd-new').value;
    const confirm = document.getElementById('pwd-confirm').value;

    let valid = true;
    if (!current) { document.getElementById('pwd-current-error').textContent = 'Joriy parol talab qilinadi'; valid = false; }
    if (!newPwd || newPwd.length < 6) { document.getElementById('pwd-new-error').textContent = 'Yangi parol kamida 6 ta belgidan iborat bo\'lishi kerak'; valid = false; }
    if (newPwd !== confirm) { document.getElementById('pwd-confirm-error').textContent = 'Parollar mos kelmadi'; valid = false; }
    if (!valid) return;

    try {
      await api.post('/auth/change-password', { currentPassword: current, newPassword: newPwd });
      Toast.success('Parol o\'zgartirildi. Qaytadan kiring');
      setTimeout(() => Auth.logout(), 2000);
    } catch(e) { Toast.error(e.message); }
  }

  function logoutAllSessions() {
    Confirm.show('Barcha sessiyalardan chiqmoqchimisiz?', 'Tasdiqlash', () => {
      Auth.logout();
    });
  }

  loadProfile();
</script>
</body>
</html>
