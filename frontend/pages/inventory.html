<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ombor Qoldig'i - OmborXona</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="navbar" id="navbar"></header>
    <main class="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Ombor Qoldig'i</h1>
          <p class="page-subtitle">Joriy ombor holati va harakatlar tarixi</p>
        </div>
        <div style="display:flex;gap:12px">
          <button class="btn btn-secondary" onclick="loadLowStock()">Kam qolganlar</button>
          <button class="btn btn-secondary" onclick="loadAll()">Barchasi</button>
        </div>
      </div>

      <!-- Summary cards -->
      <div class="stats-cards" id="inv-stats" style="margin-bottom:20px"></div>

      <div class="card">
        <div class="card-header">
          <div class="toolbar" style="margin:0;flex:1">
            <div class="toolbar-left">
              <div class="search-bar">
                <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="search-input" class="form-control" placeholder="Mahsulot nomi, kodi..." style="width:260px">
              </div>
              <select id="category-filter" class="form-control" style="width:200px">
                <option value="">Barcha kategoriyalar</option>
              </select>
              <select id="stock-filter" class="form-control" style="width:160px">
                <option value="">Barcha qoldiqlar</option>
                <option value="low">Kam qolganlar</option>
                <option value="ok">Yetarli</option>
              </select>
            </div>
            <div class="toolbar-right">
              <span id="total-count" class="text-sm text-muted"></span>
            </div>
          </div>
        </div>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Kod</th>
                <th>Mahsulot nomi</th>
                <th>Kategoriya</th>
                <th>Joriy qoldiq</th>
                <th>Minimal qoldiq</th>
                <th>O'lchov</th>
                <th>Sotib olish narxi</th>
                <th>Jami qiymat</th>
                <th>Holat</th>
              </tr>
            </thead>
            <tbody id="inventory-table"></tbody>
          </table>
        </div>
        <div class="card-footer" style="display:flex;align-items:center;justify-content:space-between">
          <span id="page-info" class="text-sm text-muted"></span>
          <div id="pagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  if (!Layout.init()) throw new Error('Auth failed');
  Layout.setBreadcrumb([{label: 'Omborxona'}, {label: 'Ombor qoldig\'i'}]);

  let currentPage = 1;

  document.getElementById('search-input').addEventListener('input', Utils.debounce(() => { currentPage = 1; loadData(); }, 400));
  document.getElementById('category-filter').addEventListener('change', () => { currentPage = 1; loadData(); });
  document.getElementById('stock-filter').addEventListener('change', () => { currentPage = 1; loadData(); });

  async function init() {
    await loadCategories();
    loadData();
  }

  async function loadCategories() {
    try {
      const data = await api.get('/categories', { isActive: 'true' });
      const sel = document.getElementById('category-filter');
      sel.innerHTML = '<option value="">Barcha kategoriyalar</option>' +
        data.data.map(c => `<option value="${c.id}">${Utils.escapeHtml(c.name)}</option>`).join('');
    } catch(e) {}
  }

  async function loadData() {
    const tbody = document.getElementById('inventory-table');
    tbody.innerHTML = Utils.getSkeletonRows(9, 5);
    try {
      const params = { page: currentPage, limit: 20 };
      const s = document.getElementById('search-input').value.trim();
      const c = document.getElementById('category-filter').value;
      if (s) params.search = s;
      if (c) params.categoryId = c;
      params.isActive = 'true';

      const data = await api.get('/products', params);
      let products = data.data;

      const stockFilter = document.getElementById('stock-filter').value;
      if (stockFilter === 'low') products = products.filter(p => parseFloat(p.currentStock) <= parseFloat(p.minStock));
      if (stockFilter === 'ok') products = products.filter(p => parseFloat(p.currentStock) > parseFloat(p.minStock));

      renderStats(products);
      renderTable(products);

      const p = data.pagination;
      document.getElementById('total-count').textContent = `Jami: ${p.total} ta`;
      document.getElementById('page-info').textContent = `${((p.page-1)*p.limit)+1}-${Math.min(p.page*p.limit, p.total)} / ${p.total}`;
      const pEl = document.getElementById('pagination');
      pEl.innerHTML = Utils.generatePaginationHTML(p);
      Utils.setupPagination(pEl, pg => { currentPage = pg; loadData(); });
    } catch(e) { Toast.error(e.message); }
  }

  function renderStats(products) {
    const totalValue = products.reduce((sum, p) => sum + parseFloat(p.currentStock) * parseFloat(p.purchasePrice), 0);
    const lowCount = products.filter(p => parseFloat(p.currentStock) <= parseFloat(p.minStock)).length;
    const zeroCount = products.filter(p => parseFloat(p.currentStock) === 0).length;

    document.getElementById('inv-stats').innerHTML = `
      <div class="stat-card">
        <div class="stat-card-icon blue"><svg width="24" height="24" fill="none" stroke="#2563eb" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></div>
        <div class="stat-card-body">
          <div class="stat-card-label">Jami mahsulot turlari</div>
          <div class="stat-card-value">${products.length}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon green"><svg width="24" height="24" fill="none" stroke="#059669" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
        <div class="stat-card-body">
          <div class="stat-card-label">Ombor umumiy qiymati</div>
          <div class="stat-card-value" style="font-size:18px">${Utils.formatCurrency(totalValue)}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon orange"><svg width="24" height="24" fill="none" stroke="#d97706" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div>
        <div class="stat-card-body">
          <div class="stat-card-label">Kam qolgan mahsulotlar</div>
          <div class="stat-card-value">${lowCount}</div>
          <div class="stat-card-meta">Minimal darajadan past</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon red"><svg width="24" height="24" fill="none" stroke="#dc2626" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg></div>
        <div class="stat-card-body">
          <div class="stat-card-label">Omborda yo'q</div>
          <div class="stat-card-value">${zeroCount}</div>
          <div class="stat-card-meta">Qoldiq nol bo'lgan</div>
        </div>
      </div>
    `;
  }

  function renderTable(products) {
    const tbody = document.getElementById('inventory-table');
    if (!products.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-state-title">Mahsulot topilmadi</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = products.map(p => {
      const current = parseFloat(p.currentStock);
      const min = parseFloat(p.minStock);
      const isLow = current <= min;
      const isZero = current === 0;
      const totalValue = current * parseFloat(p.purchasePrice);
      let statusBadge, statusColor;
      if (isZero) { statusBadge = 'Tugagan'; statusColor = 'badge-danger'; }
      else if (isLow) { statusBadge = 'Kam'; statusColor = 'badge-warning'; }
      else { statusBadge = 'Yetarli'; statusColor = 'badge-success'; }

      return `<tr>
        <td><span class="badge badge-secondary">${Utils.escapeHtml(p.code)}</span></td>
        <td><span style="font-weight:500">${Utils.escapeHtml(p.name)}</span></td>
        <td>${Utils.escapeHtml(p.category?.name || '-')}</td>
        <td><span style="font-size:16px;font-weight:700;color:${isZero ? 'var(--danger)' : isLow ? 'var(--warning)' : 'var(--success)'}">${Utils.formatNumber(current, 2)}</span></td>
        <td>${Utils.formatNumber(min, 2)}</td>
        <td>${Utils.escapeHtml(p.unit?.symbol || '-')}</td>
        <td>${Utils.formatCurrency(p.purchasePrice)}</td>
        <td><span style="font-weight:600">${Utils.formatCurrency(totalValue)}</span></td>
        <td><span class="badge ${statusColor}">${statusBadge}</span></td>
      </tr>`;
    }).join('');
  }

  function loadLowStock() {
    document.getElementById('stock-filter').value = 'low';
    currentPage = 1;
    loadData();
  }

  function loadAll() {
    document.getElementById('stock-filter').value = '';
    currentPage = 1;
    loadData();
  }

  init();
</script>
</body>
</html>
